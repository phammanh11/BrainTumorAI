name = "braintumorai"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# 1. D1 Database: Lưu trữ 9 bảng dữ liệu quan hệ
[[d1_databases]]
binding = "DB"
database_name = "brain-tumor-db"
database_id = "7a3ca809-d7ce-4d89-b36a-b54bb909fe04"

# 2. R2 Object Storage: Lưu trữ ảnh MRI riêng tư và tệp mô hình ONNX
[[r2_buckets]]
binding = "MRI_BUCKET"
bucket_name = "brain-mri-private-bucket"

# 3. Workers KV: Lưu trữ phiên đăng nhập (Session Token có TTL và thu hồi)
[[kv_namespaces]]
binding = "SESSION_KV"
id = "69803e36f42245ca8b59acaabbbc9fe6"

# 4. Vectorize Index: Lưu trữ vector nhúng của bộ dữ liệu hỏi đáp y tế cho Chatbot RAG
[[vectorize]]
binding = "FAQ_VECTORIZE"
index_name = "brain-tumor-faq-index"

# 5. Workers AI: Sinh vector embedding và câu trả lời LLM
[ai]
binding = "AI"

[vars]
AI_GATEWAY_ID = "brain-tumor-ai-gateway"
MODEL_VERSION = "brain_mri_student_onnx_v2.1 (Distilled 5-Fold ConvNeXt+SwinV2+EffNetV2)"
MAX_UPLOAD_MB = "10"
